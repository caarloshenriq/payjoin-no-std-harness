[workspace]

[package]
name = "sender-sim"
version = "0.1.0"
edition = "2021"

[dependencies]
harness-device = { path = "../harness-device" }
harness-proto = { path = "../harness-proto" }
payjoin = { git = "https://github.com/caarloshenriq/rust-payjoin", branch = "feat/payjoin-nostd", default-features = false, features = ["alloc", "v1", "v2"] }
bitcoin = { version = "0.32.9", default-features = false }
serialport = "4.3"
anyhow = "1.0.81"
pkg-config = "0.3.30"
